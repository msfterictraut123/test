<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>outageke API — Business Test Client</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #12151c;
    --border: #232733;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #f5a623;
    --green: #3ecf8e;
    --red: #f0554d;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 40px 24px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    background: #0b0d12;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: #1a1300;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  #status {
    font-size: 13px;
    margin: 12px 0;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  #status.ok { display: block; background: rgba(62,207,142,0.1); color: var(--green); border: 1px solid rgba(62,207,142,0.3); }
  #status.err { display: block; background: rgba(240,85,77,0.1); color: var(--red); border: 1px solid rgba(240,85,77,0.3); }
  pre {
    background: #05070a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
    max-height: 420px;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: -8px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>outageke API — Business Test Client</h1>
  <div class="sub">Simulates a business calling the outageke API with a real API key.</div>

  <div class="card">
    <label>API Base URL</label>
    <input id="baseUrl" value="http://localhost:3000/api/v1" />
    <div class="hint">Change the port to match your running Express server.</div>

    <label>API Key</label>
    <input id="apiKey" placeholder="outageke_live_xxxxxxxxxxxxxxxx" />
    <div class="hint">Generate one with: node scripts/createApiKey.js "Test Business" "you@email.com" free</div>

    <div class="row">
      <div>
        <label>County (optional)</label>
        <input id="county" placeholder="nairobi" />
      </div>
      <div>
        <label>Source</label>
        <select id="source">
          <option value="all">all</option>
          <option value="kplc">kplc</option>
          <option value="user_report">user_report</option>
        </select>
      </div>
    </div>

    <button onclick="callEndpoint('outages')">GET /outages</button>
    <button onclick="callEndpoint('current')">GET /outages/current</button>
    <button class="secondary" onclick="callEndpoint('no_auth')">Test without key (expect 401)</button>
    <button class="secondary" onclick="callEndpoint('bad_key')">Test bad key (expect 401)</button>
  </div>

  <div id="status"></div>
  <pre id="output">Results will appear here.</pre>
</div>

<script>
async function callEndpoint(kind) {
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const county = document.getElementById('county').value.trim();
  const source = document.getElementById('source').value;
  const statusEl = document.getElementById('status');
  const outputEl = document.getElementById('output');

  let url = `${baseUrl}/outages`;
  let headers = {};

  if (kind === 'current') url = `${baseUrl}/outages/current`;
  if (kind === 'outages' || kind === 'current') {
    const params = new URLSearchParams();
    if (county) params.set('county', county);
    if (source && source !== 'all') params.set('source', source);
    if ([...params].length) url += `?${params.toString()}`;
    headers['Authorization'] = `Bearer ${apiKey}`;
  }

  if (kind === 'no_auth') {
    url = `${baseUrl}/outages/current`;
    // deliberately no Authorization header
  }

  if (kind === 'bad_key') {
    url = `${baseUrl}/outages/current`;
    headers['Authorization'] = 'Bearer outageke_live_invalidkey00000000';
  }

  statusEl.className = '';
  statusEl.style.display = 'none';
  outputEl.textContent = 'Loading...';

  try {
    const res = await fetch(url, { headers });
    const data = await res.json();

    statusEl.style.display = 'block';
    if (res.ok) {
      statusEl.className = 'ok';
      statusEl.textContent = `✓ ${res.status} ${res.statusText} — ${url}`;
    } else {
      statusEl.className = 'err';
      statusEl.textContent = `✗ ${res.status} ${res.statusText} — ${url}`;
    }

    outputEl.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    statusEl.style.display = 'block';
    statusEl.className = 'err';
    statusEl.textContent = `✗ Request failed — is your server running and CORS enabled?`;
    outputEl.textContent = String(err);
  }
}
</script>
</body>
</html>
